<svg width="100%" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Inter', Roboto, sans-serif;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.5px;
        fill: #94A3B8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #E2E8F0;
      }
      .wave {
        animation: float 8s ease-in-out infinite alternate;
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(6px); }
      }
    </style>
  </defs>

  <!-- Base Card Background with subtle border -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="998" height="238" rx="15" stroke="url(#cyberGrad)" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Ambient Wave Ribbons -->
  <path class="wave" d="M0 160 C 250 110, 450 210, 700 150 C 850 110, 950 170, 1000 160 L 1000 240 L 0 240 Z" fill="url(#waveGrad1)" />
  <path class="wave" d="M0 190 C 200 160, 400 220, 650 180 C 850 140, 950 210, 1000 190 L 1000 240 L 0 240 Z" fill="url(#waveGrad2)" />

  <!-- Accent Top Glow Line -->
  <line x1="150" y1="1" x2="850" y2="1" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#glow)" />

  <!-- Main Name with Cyber Gradient -->
  <text x="500" y="85" text-anchor="middle" class="title" fill="url(#cyberGrad)" filter="url(#glow)">
    Muhammad Rafique
  </text>
  <text x="500" y="85" text-anchor="middle" class="title" fill="url(#cyberGrad)">
    Muhammad Rafique
  </text>

  <!-- Subtitle / Roles -->
  <text x="500" y="125" text-anchor="middle" class="subtitle">
    Software Engineer • Full Stack &amp; Mobile Architect • Founder @ MR Software
  </text>

  <!-- Tag Badges at Bottom of Banner -->
  <g transform="translate(180, 160)">
    <!-- Badge 1: Healthcare ERP -->
    <g transform="translate(0, 0)">
      <rect width="135" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
      <text x="67" y="18" text-anchor="middle" class="badge-text">🏥 Healthcare ERP</text>
    </g>

    <!-- Badge 2: Flutter & Android -->
    <g transform="translate(150, 0)">
      <rect width="145" height="28" rx="14" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1" />
      <text x="72" y="18" text-anchor="middle" class="badge-text">📱 Flutter &amp; Android</text>
    </g>

    <!-- Badge 3: WebRTC Video -->
    <g transform="translate(310, 0)">
      <rect width="140" height="28" rx="14" fill="#1E293B" stroke="#C084FC" stroke-opacity="0.4" stroke-width="1" />
      <text x="70" y="18" text-anchor="middle" class="badge-text">📹 WebRTC Video</text>
    </g>

    <!-- Badge 4: 100m Gold Medalist -->
    <g transform="translate(465, 0)">
      <rect width="175" height="28" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1" />
      <text x="87" y="18" text-anchor="middle" class="badge-text">🥇 100m Gold Medalist</text>
    </g>
  </g>
</svg>
